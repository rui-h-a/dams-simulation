name: Research validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DAMS_CLOUD_PRIVATE_CONFIG: ""
    steps:
      - name: Check out the actual workflow commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the evidence directory
        run: mkdir -p runs/ci-evidence

      - name: Prepare fixed uv and Python selection
        id: tools
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.26"
          checksum: "30ccbf0a66dc8727a02b0e245c583ee970bdafecf3a443c1686e1b30ec4939e8"
          python-version: "3.14.2"
          enable-cache: "false"
          download-from-astral-mirror: "false"

      - name: Install the locked analysis environment
        id: install
        run: |
          set -euo pipefail
          uv sync --locked --extra analysis --python 3.14.2 2>&1 | tee runs/ci-evidence/install.log
          uv --version > runs/ci-evidence/uv-version.txt
          uv run --no-sync python -VV > runs/ci-evidence/python-version.txt

      - name: Check shell entry syntax
        id: shell
        run: |
          set -euo pipefail
          for task_file in run.sh bootstrap.sh cloud/install-services.sh; do
            bash -n "$task_file"
          done > runs/ci-evidence/shell-syntax.log 2>&1

      - name: Run all unit and regression tests
        id: tests
        run: |
          set -euo pipefail
          uv run --no-sync python -m unittest discover -s tests -v 2>&1 | tee runs/ci-evidence/tests.log

      - name: Build the standalone core package
        id: build
        run: |
          set -euo pipefail
          uv build 2>&1 | tee runs/ci-evidence/build.log

      - name: Execute the complete declared validation study
        id: pipeline
        run: |
          set -euo pipefail
          ./run.sh --spec validation --scale 120 --output runs/ci-validation 2>&1 | tee runs/ci-evidence/pipeline.log

      - name: Independently verify scientific and publication completion
        id: validation
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY' 2>&1 | tee runs/ci-evidence/scientific-validation.log
          import json
          from pathlib import Path
          from research_tools.validate_pipeline import validate_pipeline_output
          result = validate_pipeline_output(Path('runs/ci-validation'), 'validation', 120)
          Path('runs/ci-evidence/scientific-validation.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps({k: v for k, v in result.items() if k != 'case_origins'}, indent=2))
          PY

      - name: Record successful or failed execution evidence
        if: always()
        env:
          CI_CHECKOUT: ${{ steps.checkout.outcome }}
          CI_TOOLS: ${{ steps.tools.outcome }}
          CI_INSTALL: ${{ steps.install.outcome }}
          CI_SHELL: ${{ steps.shell.outcome }}
          CI_TESTS: ${{ steps.tests.outcome }}
          CI_BUILD: ${{ steps.build.outcome }}
          CI_PIPELINE: ${{ steps.pipeline.outcome }}
          CI_VALIDATION: ${{ steps.validation.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path('runs/ci-evidence')
          evidence.mkdir(parents=True, exist_ok=True)
          inventory = {}
          for root in (evidence, pathlib.Path('runs/ci-validation')):
              if root.exists():
                  for path in sorted(root.rglob('*')):
                      if path.is_file() and not path.is_symlink():
                          h = hashlib.sha256()
                          with path.open('rb') as stream:
                              for block in iter(lambda: stream.read(1024 * 1024), b''):
                                  h.update(block)
                          inventory[str(path)] = {'sha256': h.hexdigest(), 'bytes': path.stat().st_size}
          def git_read(args):
              try:
                  p = subprocess.run(['git', *args], text=True, capture_output=True)
                  return {'exit_code': p.returncode, 'stdout': p.stdout, 'stderr': p.stderr}
              except OSError as error:
                  return {'exit_code': None, 'stdout': '', 'stderr': str(error)}
          status = git_read(['status', '--porcelain', '--untracked-files=all'])
          head = git_read(['rev-parse', 'HEAD'])
          result = {
              'workflow_commit': os.environ.get('GITHUB_SHA'),
              'checkout_commit': head['stdout'].strip() if head['exit_code'] == 0 else None,
              'source_clean': not status['stdout'] if status['exit_code'] == 0 else None,
              'git_reads': {'status': status, 'head': head},
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'spec': 'validation', 'population': 120,
              'steps': {key[3:].lower(): os.environ[key] for key in os.environ if key.startswith('CI_')},
              'files': inventory,
              'cloud_resources_requested': False,
              'scope': 'Actual runner evidence; the declared small study does not certify formal precision, cloud recovery or hardware performance.'
          }
          (evidence / 'execution-manifest.json').write_text(json.dumps(result, indent=2) + '\n')
          if head['exit_code'] != 0 or status['exit_code'] != 0:
              raise SystemExit('source checkout is unavailable; failure evidence retained')
          if status['stdout']:
              raise SystemExit('source checkout changed during validation; failure evidence retained')
          PY

      - name: Retain all available results and failure records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/ci-evidence/
            runs/ci-validation/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
