name: Bounded Linux journal validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe system Python SQLite independently
        run: /usr/bin/python3 validation/journal_chunks/capabilities.py --label system-python
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.26"
          checksum: "30ccbf0a66dc8727a02b0e245c583ee970bdafecf3a443c1686e1b30ec4939e8"
          python-version: "3.14.2"
          enable-cache: "false"
          download-from-astral-mirror: "false"
      - name: Supervise finite managed-Python controls and print manifests
        run: |
          control_python="$(uv python find 3.14.2)"
          /usr/bin/python3 validation/journal_chunks/run_controls.py --control-python "$control_python"
